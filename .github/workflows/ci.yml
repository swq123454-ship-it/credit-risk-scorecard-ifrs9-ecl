name: ci

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run the pipeline end to end on a small synthetic book
        run: python scripts/run_pipeline.py --loans 20000 --quiet

      - name: Check the pipeline produced its artefacts
        run: |
          test -f outputs/metrics.json
          test -f outputs/RESULTS.md
          test -f outputs/figures/ecl_scenarios.png
          ls outputs/tables | wc -l

      - name: Run the test suite
        run: pytest -q

      - name: Upload figures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: figures-py${{ matrix.python-version }}
          path: outputs/figures
          if-no-files-found: ignore
